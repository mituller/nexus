[package]
name = "nexus"
version = "0.1.6"
description = "Nexus Knowledge Management"
authors = []
edition = "2021"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-shell = "2"
# rustls-tls-native-roots adds the macOS system trust store to the default
# webpki roots, so TLS-intercepting corporate proxies (Zscaler) are trusted.
tauri-plugin-http = { version = "2", features = ["rustls-tls-native-roots"] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
aws-sdk-transcribestreaming = "1.121.0"
tokio-stream = "0.1.19"
cpal = "0.18.2"
