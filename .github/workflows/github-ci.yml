name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  rust-test:
    # macOS: the audio and webview dependencies build here without extra packages.
    # Windows is covered by windows-build.yml.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! needs frontendDist to exist. These tests don't use its contents.
      - run: mkdir -p dist
      - run: cargo test --locked
        working-directory: src-tauri
