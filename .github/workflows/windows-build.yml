name: Windows build

# Builds the Windows installer, proving the app compiles and bundles on Windows (WebView2,
# microphone capture via WASAPI). Runs on pushes to main and on demand
# (Actions -> Windows build -> Run workflow); a release build takes ~10-15 minutes.
#
# Known gap: extract_text_from_file shells out to macOS `textutil`, so extracting text from
# Office/RTF/PDF files fails at runtime on Windows. Everything else is cross-platform.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
